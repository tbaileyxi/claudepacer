<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0D0D14" stroke="#D97757" stroke-width="4"/>
  
  <!-- Race car body -->
  <path d="M25 70 Q25 55 35 50 L45 45 L83 45 L93 50 Q103 55 103 70 L103 80 Q103 85 98 85 L30 85 Q25 85 25 80 Z" fill="#D97757"/>
  
  <!-- Car details -->
  <rect x="40" y="52" width="48" height="8" rx="2" fill="#0D0D14"/>
  <rect x="45" y="63" width="8" height="8" rx="1" fill="#0D0D14"/>
  <rect x="75" y="63" width="8" height="8" rx="1" fill="#0D0D14"/>
  
  <!-- Wheels -->
  <circle cx="35" cy="80" r="8" fill="#333"/>
  <circle cx="35" cy="80" r="4" fill="#666"/>
  <circle cx="93" cy="80" r="8" fill="#333"/>
  <circle cx="93" cy="80" r="4" fill="#666"/>
  
  <!-- Speed lines -->
  <path d="M15 45 L25 45 M10 50 L20 50 M15 55 L25 55" stroke="#D97757" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M103 45 L113 45 M108 50 L118 50 M103 55 L113 55" stroke="#D97757" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Speedometer needle -->
  <line x1="64" y1="64" x2="85" y2="45" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="4" fill="#22C55E"/>
</svg>
